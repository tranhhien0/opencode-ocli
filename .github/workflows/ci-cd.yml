name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: ["20", "22"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "${{ matrix.node-version }}"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - run: test -f dist/index.js
      - run: npm run version:bump:verify
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-npm:
    name: Publish to NPM
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.pkgver.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      - run: npm publish --access public --tag next --provenance
      - id: pkgver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          scope: "@tranhhien0"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - name: Scope package name for GitHub Packages
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@tranhhien0/opencode-ocli';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
      - run: npm publish --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  summary:
    name: Log usage instructions
    runs-on: ubuntu-latest
    needs: [publish-npm, publish-github]
    if: always() && (needs.publish-npm.result == 'success' || needs.publish-github.result == 'success')
    steps:
      - name: Write usage summary
        run: |
          {
            echo "## 📦 Publish Results"
            echo ""
            echo "| Registry | Status |"
            echo "|---|---|"
            echo "| npmjs.org | ${{ needs.publish-npm.result }} |"
            echo "| GitHub Packages | ${{ needs.publish-github.result }} |"
            echo ""
            echo "### Cách dùng — npm registry (public)"
            echo '```bash'
            echo "npm install opencode-ocli@next"
            echo '```'
            echo ""
            echo "### Cách dùng — GitHub Packages"
            echo "1. Tạo file \`.npmrc\` trong project của bạn:"
            echo '```'
            echo "@tranhhien0:registry=https://npm.pkg.github.com"
            echo "//npm.pkg.github.com/:_authToken=\${GITHUB_TOKEN}"
            echo '```'
            echo "2. Cần Personal Access Token (classic) có scope \`read:packages\`, hoặc \`GITHUB_TOKEN\` nếu dùng trong Actions."
            echo "3. Cài đặt:"
            echo '```bash'
            echo "npm install @tranhhien0/opencode-ocli@next"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
